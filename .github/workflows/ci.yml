name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files '*.go')"
          if [ -z "${files}" ]; then
            exit 0
          fi
          unformatted="$(gofmt -l ${files})"
          if [ -n "${unformatted}" ]; then
            echo "These files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test selective daemon packages
        shell: bash
        run: |
          set -euo pipefail
          for platform in $(make -s print-platforms); do
            go test -tags "no_${platform}" ./internal/daemon/...
          done

      - name: Build selective CLI
        shell: bash
        run: |
          set -euo pipefail

          join_with() {
            local delimiter="$1"
            awk -v delimiter="${delimiter}" '
              BEGIN { first = 1 }
              {
                if (!first) {
                  printf "%s", delimiter
                }
                printf "%s", $0
                first = 0
              }
              END { printf "\n" }
            '
          }

          verify_build() {
            local compiled_summary help_output run_help_output selected_choices selected_summary

            make clean build "$@"

            help_output="$(./tmux-connect daemon help)"
            run_help_output="$(./tmux-connect daemon run --help 2>&1)"
            selected_summary="$(make -s print-selected-platforms "$@" | join_with ', ')"
            selected_choices="$(make -s print-selected-platforms "$@" | join_with '|')"
            compiled_summary="$(
              printf '%s\n' "${help_output}" | awk '
                /^Compiled platforms:$/ {
                  getline
                  sub(/^  /, "", $0)
                  print
                  exit
                }
              '
            )"

            printf '%s\n' "${help_output}" | grep -F "Compiled platforms:"
            [ "${compiled_summary}" = "${selected_summary}" ]
            printf '%s\n' "${run_help_output}" | grep -F "remote platform in this build (${selected_choices})"
          }

          verify_build

          first_two_exclude="$(
            make -s print-platforms | awk '
              NR <= 2 {
                if (NR > 1) {
                  printf ","
                }
                printf "%s", $0
              }
              END { printf "\n" }
            '
          )"
          if [ -n "${first_two_exclude}" ]; then
            verify_build "EXCLUDE=${first_two_exclude}"
          fi

          for platform in $(make -s print-platforms); do
            verify_build "EXCLUDE=${platform}"
            verify_build "PLATFORMS_INCLUDE=${platform}"
          done
